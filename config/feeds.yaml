# Danh sách feed cố định TRƯỚC khi thu thập (xem docs/DECISIONS.md để biết lý do chọn).
# operator: tổ chức vận hành. Khi kiểm tra "hai nguồn độc lập" (GT-2) phải đếm theo operator, không đếm theo feed.
# min_interval_minutes: khoảng cách tối thiểu giữa hai lần tải (tôn trọng nhà cung cấp).
defaults:
  min_interval_minutes: 60
  timeout_connect_s: 10
  timeout_read_s: 90
  retries: 3

feeds:
  - id: urlhaus
    name: URLhaus (recent)
    operator: abuse.ch
    url: https://urlhaus.abuse.ch/downloads/csv_recent/
    ioc_types: [url]
    ext: csv
    auth: abusech

  - id: threatfox
    name: ThreatFox (recent IOCs)
    operator: abuse.ch
    url: https://threatfox.abuse.ch/export/csv/recent/
    ioc_types: [ip, domain, url, hash]
    ext: csv
    auth: abusech

  - id: feodo
    name: Feodo Tracker (botnet C2 IP)
    operator: abuse.ch
    url: https://feodotracker.abuse.ch/downloads/ipblocklist.csv
    ioc_types: [ip]
    ext: csv
    auth: abusech

  - id: malwarebazaar
    name: MalwareBazaar (recent hashes)
    operator: abuse.ch
    url: https://bazaar.abuse.ch/export/csv/recent/
    ioc_types: [hash]
    ext: csv
    auth: abusech

  - id: openphish
    name: OpenPhish (community feed)
    operator: OpenPhish
    url: https://openphish.com/feed.txt
    ioc_types: [url]
    ext: txt

  - id: blocklist_de
    name: Blocklist.de (all)
    operator: Blocklist.de
    url: https://lists.blocklist.de/lists/all.txt
    ioc_types: [ip]
    ext: txt

  - id: cins
    name: CINS Army (bad IPs)
    operator: CINS Score
    url: http://cinsscore.com/list/ci-badguys.txt
    ioc_types: [ip]
    ext: txt

  - id: et_compromised
    name: Emerging Threats (compromised IPs)
    operator: Proofpoint
    url: https://rules.emergingthreats.net/blockrules/compromised-ips.txt
    ioc_types: [ip]
    ext: txt
