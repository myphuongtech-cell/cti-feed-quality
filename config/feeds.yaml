# Danh sách 7 feed, cố định sau pilot 2026-10-21 (đã loại Feodo vì chỉ có 5 bản ghi, xem docs/DEVIATIONS.md).
# Danh sách feed cố định TRƯỚC khi thu thập (xem docs/DECISIONS.md để biết lý do chọn).
# operator: tổ chức vận hành. Khi kiểm tra "hai nguồn độc lập" (GT-2) phải đếm theo operator, không đếm theo feed.
# min_interval_minutes: khoảng cách tối thiểu giữa hai lần tải (tôn trọng nhà cung cấp).
# abuse.ch (URLhaus, ThreatFox, MalwareBazaar) từ 2026-10-22 bắt buộc Auth-Key nằm trong URL.
# {ABUSECH_AUTH_KEY} được thay bằng biến trong file .env lúc chạy; khóa KHÔNG bao giờ được ghi vào manifest hay log.
defaults:
  min_interval_minutes: 60
  timeout_connect_s: 10
  timeout_read_s: 90
  retries: 3

feeds:
  - id: urlhaus
    name: URLhaus (recent)
    operator: abuse.ch
    url: https://urlhaus-api.abuse.ch/v2/files/exports/{ABUSECH_AUTH_KEY}/recent.csv
    ioc_types: [url]
    ext: csv

  - id: threatfox
    name: ThreatFox (recent IOCs)
    operator: abuse.ch
    url: https://threatfox-api.abuse.ch/v2/files/exports/{ABUSECH_AUTH_KEY}/recent.csv
    ioc_types: [ip, domain, url, hash]
    ext: csv

  - id: malwarebazaar
    name: MalwareBazaar (recent hashes)
    operator: abuse.ch
    url: https://mb-api.abuse.ch/v2/files/exports/{ABUSECH_AUTH_KEY}/recent.csv
    ioc_types: [hash]
    ext: csv

  - id: openphish
    name: OpenPhish (community feed)
    operator: OpenPhish
    url: https://openphish.com/feed.txt
    ioc_types: [url]
    ext: txt

  - id: blocklist_de
    name: Blocklist.de (all)
    operator: Blocklist.de
    url: https://lists.blocklist.de/lists/all.txt
    ioc_types: [ip]
    ext: txt

  - id: cins
    name: CINS Army (bad IPs)
    operator: CINS Score
    url: http://cinsscore.com/list/ci-badguys.txt
    ioc_types: [ip]
    ext: txt

  - id: et_compromised
    name: Emerging Threats (compromised IPs)
    operator: Proofpoint
    url: https://rules.emergingthreats.net/blockrules/compromised-ips.txt
    ioc_types: [ip]
    ext: txt
